name: Gilt
description: 'Gilt (Gilt Groupe) is a members-only flash-sale e-commerce retailer offering limited-time
  sales on designer and luxury fashion, accessories, home goods, and travel at discounted prices. Founded
  in 2007, Gilt pioneered the flash-sale model in the United States, hosting time-boxed curated sales
  events for a member base. The company was acquired by Hudson''s Bay Company in 2016 and later combined
  with Rue La La to form Rue Gilt Groupe. Gilt operates primarily as a consumer-facing web and mobile
  shopping experience; it does not currently publish a public developer API or developer portal.'
